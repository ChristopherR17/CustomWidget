name: proxmox_drive_clean
description: Gestor d'arxius remot amb SSH/SFTP per a Proxmox.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartssh2: ^2.13.0
  path_provider: ^2.1.5
  archive: ^4.0.9
  file_picker: ^11.0.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/json/remote_profiles.json
